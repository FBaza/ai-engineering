[project]
name = "estimador-cag"
version = "0.1.0"
description = "Servicio de estimacion de software a partir de transcripciones de reunion, con arquitectura CAG (contexto estatico inyectado en el prompt)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "python-dotenv>=1.0",
]
